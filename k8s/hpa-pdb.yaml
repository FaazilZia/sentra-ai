apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sentra-backend-hpa
  namespace: sentra-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sentra-backend
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 3
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sentra-worker-hpa
  namespace: sentra-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sentra-worker
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600  # Slow scale-down for workers to drain jobs
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sentra-backend-pdb
  namespace: sentra-production
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: sentra-backend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sentra-worker-pdb
  namespace: sentra-production
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: sentra-worker
