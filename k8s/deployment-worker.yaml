apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentra-worker
  namespace: sentra-production
  labels:
    app: sentra-worker
    component: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sentra-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: sentra-worker
        component: worker
      annotations:
        prometheus.io/scrape: "false"
    spec:
      serviceAccountName: sentra-backend
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60  # Workers need more time to drain jobs
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      containers:
        - name: worker
          image: ghcr.io/sentra-ai/backend:2.0.0
          imagePullPolicy: IfNotPresent
          command: ["node", "dist/worker.js"]
          env:
            - name: NODE_ENV
              value: "production"
            - name: WORKER_MODE
              value: "true"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sentra-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: sentra-secrets
                  key: REDIS_URL
          envFrom:
            - configMapRef:
                name: sentra-config
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
              ephemeral-storage: "256Mi"
          livenessProbe:
            exec:
              command: ["node", "-e", "require('./dist/health-worker.js')"]
            initialDelaySeconds: 20
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
