apiVersion: v1
kind: ConfigMap
metadata:
  name: sentra-config
  namespace: sentra-production
data:
  NODE_ENV: "production"
  FRONTEND_URL: "https://app.sentra.ai"
  LOG_LEVEL: "info"
  APP_NAME: "Sentra AI"
  DATA_REGION: "US"
  # Feature flags defaults
  ENABLE_PROMETHEUS: "true"
  ENABLE_MFA: "true"
  # Rate limiting
  RATE_LIMIT_WINDOW_MS: "60000"
  RATE_LIMIT_MAX: "100"
---
# Secret template — populate with actual values before applying
# In production: use Sealed Secrets, Vault Agent Injector, or AWS Secrets Manager CSI driver
apiVersion: v1
kind: Secret
metadata:
  name: sentra-secrets
  namespace: sentra-production
  annotations:
    # Reminder: Replace placeholder values with real secrets
    config.kubernetes.io/local-config: "true"
type: Opaque
stringData:
  DATABASE_URL: "postgresql://user:CHANGEME@postgres:5432/sentra"
  REDIS_URL: "redis://redis:6379"
  JWT_SECRET: "CHANGEME-use-openssl-rand-base64-32"
  REFRESH_TOKEN_SECRET: "CHANGEME-use-openssl-rand-base64-32"
  ENCRYPTION_KEY: "CHANGEME-use-openssl-rand-hex-32"
  METRICS_SECRET_TOKEN: "CHANGEME-prometheus-scrape-token"
  SENTRY_DSN: ""
  GITHUB_CLIENT_ID: ""
  GITHUB_CLIENT_SECRET: ""
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""
