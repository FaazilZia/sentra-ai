apiVersion: v1
kind: Service
metadata:
  name: sentra-backend
  namespace: sentra-production
  labels:
    app: sentra-backend
spec:
  type: ClusterIP
  selector:
    app: sentra-backend
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sentra-ingress
  namespace: sentra-production
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    - hosts:
        - api.sentra.ai
      secretName: sentra-tls
  rules:
    - host: api.sentra.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sentra-backend
                port:
                  number: 80
