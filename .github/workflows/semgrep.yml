name: Semgrep SAST

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Run weekly scan every Monday at 06:00 UTC
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep SAST Scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep SAST Scan
        run: |
          semgrep scan \
            --config "p/security-audit" \
            --config "p/owasp-top-ten" \
            --config "p/javascript" \
            --config "p/typescript" \
            --config "p/react" \
            --exclude="tests" \
            --exclude="e2e" \
            --exclude="scratch" \
            --exclude="dist" \
            --exclude="coverage" \
            --exclude="playwright-report" \
            --exclude="node_modules" \
            --exclude="*.test.ts" \
            --exclude="*.test.tsx" \
            --exclude="*.spec.ts" \
            --exclude="*.spec.tsx" \
            --text \
            --sarif \
            --output=semgrep.sarif \
            --no-error

      - name: Publish Step Summary
        if: always()
        run: |
          echo "## 🛡️ Semgrep SAST Scan Completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Semgrep static security analysis ran across production backend, frontend, and SDK code." >> $GITHUB_STEP_SUMMARY
          echo "- **Rulesets Evaluated:** \`p/security-audit\`, \`p/owasp-top-ten\`, \`p/javascript\`, \`p/typescript\`, \`p/react\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Exclusions Applied:** \`.semgrepignore\` (test suites, mock harnesses, scratch files, build artifacts)" >> $GITHUB_STEP_SUMMARY
          echo "- **Mode:** Report-only (non-blocking for initial rollout)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Full details of any detected findings are available in the job logs and the attached SARIF report artifact." >> $GITHUB_STEP_SUMMARY

      - name: Upload SARIF Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sarif-report
          path: semgrep.sarif
          retention-days: 14
