# ─────────────────────────────────────────────
# Sentra AI Helm Values (Production Defaults)
# Override per environment with -f values.prod.yaml
# ─────────────────────────────────────────────

global:
  imageRegistry: "ghcr.io/sentra-ai"
  imageTag: "2.0.0"
  imagePullPolicy: IfNotPresent
  namespace: sentra-production

# ── Backend API ────────────────────────────────
backend:
  enabled: true
  replicas: 3
  image: backend
  port: 3000

  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"

  hpa:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    cpuTargetPercent: 65
    memoryTargetPercent: 75

  pdb:
    minAvailable: 2

  env:
    NODE_ENV: production
    PORT: "3000"
    LOG_LEVEL: info
    APP_NAME: "Sentra AI"

  secrets:
    # Reference existing Kubernetes Secret
    existingSecret: "sentra-secrets"

  livenessProbe:
    path: /ping
    initialDelaySeconds: 15
    periodSeconds: 15

  readinessProbe:
    path: /api/v1/ready
    initialDelaySeconds: 10
    periodSeconds: 10

# ── Worker ─────────────────────────────────────
worker:
  enabled: true
  replicas: 2

  resources:
    requests:
      cpu: "200m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    cpuTargetPercent: 70

  pdb:
    minAvailable: 1

# ── Ingress ────────────────────────────────────
ingress:
  enabled: true
  className: nginx
  host: api.sentra.ai
  tls:
    enabled: true
    secretName: sentra-tls
    clusterIssuer: letsencrypt-prod
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"

# ── Observability ──────────────────────────────
observability:
  prometheus:
    enabled: true
    scrapeInterval: 15s
  sentry:
    enabled: false
    dsn: ""

# ── PostgreSQL (external managed DB recommended for prod) ──
postgresql:
  enabled: false   # Set to true for local dev only
  auth:
    database: sentra
    username: sentra

# ── Redis ─────────────────────────────────────
redis:
  enabled: false   # Set to true for local dev only
  auth:
    enabled: true
