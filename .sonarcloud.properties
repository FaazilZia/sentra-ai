# .sonarcloud.properties — Respected by SonarCloud Automatic Analysis
# (unlike sonar-project.properties which is only used by the CI scanner)

# ──────────────────────────────────────────────────────────
# EXCLUSIONS: Files excluded from ALL analysis
# ──────────────────────────────────────────────────────────
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/generated/**,\
  **/playwright-report/**,\
  **/test-results/**,\
  **/coverage/**,\
  **/*.test.ts,\
  **/*.spec.ts,\
  **/*.test.tsx,\
  **/*.spec.tsx,\
  **/tests/**,\
  **/e2e/**,\
  **/__mocks__/**,\
  **/fixtures/**,\
  **/scripts/**,\
  **/seed.ts,\
  k8s/**,\
  helm/**,\
  observability/**,\
  docker-compose*.yml,\
  **/*.sql,\
  **/Dockerfile,\
  frontend/public/**,\
  frontend/src/components/ui/AnimatedBackground.tsx,\
  frontend/src/components/ui/FloatingLines.tsx,\
  frontend/src/components/ui/FloatingMolecules.tsx,\
  frontend/src/components/ui/FloatingParticles.tsx,\
  frontend/src/components/ui/GooeyNav.tsx,\
  frontend/src/components/ui/NeuralBackground.tsx,\
  frontend/src/components/ui/NeuralCore.tsx

# ──────────────────────────────────────────────────────────
# DUPLICATION EXCLUSIONS: Files excluded from copy-paste detection
# ──────────────────────────────────────────────────────────
sonar.cpd.exclusions=\
  **/migrations/**,\
  **/seed/**,\
  **/tests/**,\
  **/*.test.ts,\
  **/*.spec.ts,\
  **/fixtures/**,\
  **/mocks/**,\
  **/*.sql,\
  **/scripts/**,\
  **/routes/*.ts,\
  **/controllers/*.ts,\
  frontend/src/components/ui/**,\
  frontend/src/pages/**,\
  frontend/src/lib/permissions.ts,\
  backend/src/services/*Seed.service.ts,\
  backend/src/services/frameworkMapper.service.ts,\
  backend/src/services/advisor.service.ts,\
  backend/run-migration*.ts,\
  backend/src/workers/**,\
  backend/src/utils/isoSeedHelper.ts,\
  backend/src/utils/migrationHelpers.ts,\
  backend/prisma/**
