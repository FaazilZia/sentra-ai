# SonarCloud Configuration
sonar.projectKey=FaazilZia_sentra-ai
sonar.organization=faazilzia

# Source directories
sonar.sources=backend/src,frontend/src,packages/sdk/src

# Exclusions — files not analyzed at all
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/generated/**,\
  **/playwright-report/**,\
  **/test-results/**,\
  **/coverage/**,\
  **/*.test.ts,\
  **/*.spec.ts,\
  **/*.test.tsx,\
  **/tests/**,\
  **/e2e/**,\
  **/__mocks__/**,\
  **/fixtures/**,\
  **/scripts/**,\
  k8s/**,\
  helm/**,\
  observability/**,\
  docker-compose*.yml

# Duplication exclusions
sonar.cpd.exclusions=\
  **/migrations/**,\
  **/seed/**,\
  **/tests/**,\
  **/*.test.ts,\
  **/*.spec.ts,\
  **/fixtures/**,\
  **/mocks/**,\
  **/*.sql,\
  **/scripts/**,\
  **/routes/*.ts,\
  **/controllers/*.ts

# Coverage exclusions
sonar.coverage.exclusions=\
  **/migrations/**,\
  **/scripts/**,\
  **/*.test.ts,\
  **/*.spec.ts,\
  **/tests/**,\
  **/e2e/**,\
  k8s/**,\
  helm/**
