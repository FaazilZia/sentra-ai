  **/seed/**,\
  **/tests/**,\
  **/*.test.ts,\
  **/*.spec.ts,\
  **/fixtures/**,\
  **/mocks/**,\
  **/*.sql,\
  **/scripts/**,\
  **/routes/*.ts,\
  **/controllers/*.ts,\
  frontend/src/components/ui/**,\
  frontend/src/pages/**,\
  frontend/src/lib/permissions.ts,\
  backend/src/services/*.ts,\
  backend/run-migration*.ts,\
  backend/src/services/*Seed.service.ts,\
  backend/src/workers/**,\
  backend/src/utils/isoSeedHelper.ts,\
  backend/src/utils/migrationHelpers.ts,\
  backend/prisma/seed.ts

# ──────────────────────────────────────────────────────────
# COVERAGE EXCLUSIONS
# ──────────────────────────────────────────────────────────
sonar.coverage.exclusions=\
  **/migrations/**,\
  **/scripts/**,\
  **/*.test.ts,\
  **/*.spec.ts,\
  **/tests/**,\
