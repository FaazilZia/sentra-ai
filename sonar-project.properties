# SonarCloud Configuration
sonar.projectKey=FaazilZia_sentra-ai
sonar.organization=faazilzia
sonar.newCode.referenceBranch=main

# ──────────────────────────────────────────────────────────
# EXCLUSIONS: Files excluded from ALL analysis (bugs, vulns, hotspots, duplication)
# ──────────────────────────────────────────────────────────
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/generated/**,\
  **/playwright-report/**,\
  **/test-results/**,\
  **/coverage/**,\
  **/*.test.ts,\
  **/*.spec.ts,\
  **/*.test.tsx,\
  **/*.spec.tsx,\
  **/tests/**,\
  **/e2e/**,\
  **/__mocks__/**,\
  **/fixtures/**,\
  **/scripts/**,\
  **/seed.ts,\
  k8s/**,\
  helm/**,\
  observability/**,\
  docker-compose*.yml,\
  **/*.sql,\
  **/Dockerfile,\
  **/*.sh,\
  scratch/**,\
  *.py,\
  frontend/public/**,\
  frontend/src/components/ui/AnimatedBackground.tsx,\
  frontend/src/components/ui/FloatingLines.tsx,\
  frontend/src/components/ui/FloatingMolecules.tsx,\
  frontend/src/components/ui/FloatingParticles.tsx,\
  frontend/src/components/ui/GooeyNav.tsx,\
  frontend/src/components/ui/NeuralBackground.tsx,\
  frontend/src/components/ui/NeuralCore.tsx

# ──────────────────────────────────────────────────────────
# DUPLICATION EXCLUSIONS: Files excluded from copy-paste detection
# ──────────────────────────────────────────────────────────
