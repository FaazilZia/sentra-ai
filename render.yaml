services:
  - type: web
    name: sentra-backend-node
    env: node
    plan: free
    numInstances: 1
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start:render
    healthCheckPath: /ping
    envVars:
      - key: SENTRY_DSN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://sentra-ai-tau.vercel.app,https://sentra-ai.vercel.app,http://localhost:5173,https://sentraatech.info,https://www.sentraatech.info
      - key: PORT
        value: 10000
      - key: ENCRYPTION_KEY
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: HUGGINGFACE_MODEL
        value: mistralai/Mistral-7B-Instruct-v0.2
      - key: REDIS_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
