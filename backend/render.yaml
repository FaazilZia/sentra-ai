services:
  - type: web
    name: sentra-backend-node
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start:render
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://sentra-ai-tau.vercel.app,https://sentra-ai.vercel.app,http://localhost:5173
      - key: BACKEND_URL
        value: https://sentra-backend-node.onrender.com
      - key: PORT
        value: 10000
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: HUGGINGFACE_MODEL
        value: mistralai/Mistral-7B-Instruct-v0.2
      - key: REDIS_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: GOVERNANCE_SIGNING_KEYS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        value: https://sentra-backend-node.onrender.com/api/v1/auth/google/callback
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: MASKING_SALT
        sync: false
      - key: METRICS_SECRET_TOKEN
        sync: false
      - key: SCIM_BEARER_TOKEN
        sync: false
