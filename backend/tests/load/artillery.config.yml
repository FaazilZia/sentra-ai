config:
  target: "{{ $env.LOAD_TARGET_URL }}"
  phases:
    - duration: 30
      arrivalRate: 5
      name: Warm up
    - duration: 60
      arrivalRate: 15
      name: Sustained load
    - duration: 30
      arrivalRate: 25
      name: Peak load
  defaults:
    headers:
      Authorization: "Bearer {{ $env.TEST_AUTH_TOKEN }}"
      Content-Type: "application/json"
  plugins:
    ensure: {}
  ensure:
    # Latency thresholds — based on observed local response times.
    # Under 25 req/sec concurrent load, the local Postgres baseline for
    # authenticated findMany queries (drift_alerts, action_logs) is ~700ms
    # median. p95 at 800ms catches real regressions while accommodating
    # the inherent query latency floor observed across all load phases.
    p95: 800
    p99: 1500
    # Error rate — percentage of VUs that fail to complete their scenario.
    maxErrorRate: 1
    # HTTP success rate condition — ensures at least 99% of HTTP requests return 200 OK,
    # preventing false-positive passes when rate-limiter 429s pollute metrics.
    conditions:
      - expression: "(http.codes.200 / http.requests) >= 0.99"
        strict: true

before:
  flow:
    - log: "Load test starting — target: {{ $env.LOAD_TARGET_URL }}"

scenarios:
  - name: "Health check"
    weight: 15
    flow:
      - get:
          url: "/api/health"
          expect:
            - statusCode: 200

  - name: "Drift alerts check"
    weight: 50
    flow:
      - get:
          url: "/api/v1/drift/alerts"
          expect:
            - statusCode: 200

  - name: "AI logs retrieval"
    weight: 35
    flow:
      - get:
          url: "/api/v1/ai/logs"
          expect:
            - statusCode: 200
