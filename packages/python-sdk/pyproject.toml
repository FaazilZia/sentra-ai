[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentraa-ai"
version = "0.1.0"
description = "Enterprise-grade Python SDK for real-time AI governance and runtime security."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
    { name = "Sentraa AI Team" }
]
keywords = [
    "ai-governance",
    "ai-security",
    "guardrails",
    "llm-security",
    "runtime-protection",
    "sentra",
    "sentraa",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
dependencies = [
    "certifi>=2021.10.8",
]

[project.urls]
Homepage = "https://sentraatech.info"
Repository = "https://github.com/FaazilZia/sentra-ai"
Documentation = "https://github.com/FaazilZia/sentra-ai/tree/main/packages/python-sdk#readme"
"Bug Tracker" = "https://github.com/FaazilZia/sentra-ai/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
openai = [
    "openai>=1.0.0",
]
anthropic = [
    "anthropic>=0.18.0",
]
bedrock = [
    "boto3>=1.28.0",
]
vertex = [
    "google-genai>=0.1.1; python_version >= '3.10'",
]
langchain = [
    "langchain>=0.1.0; python_version >= '3.9'",
    "langchain-core>=0.1.0; python_version >= '3.9'",
    "langchain-openai>=0.1.0; python_version >= '3.9'",
]
all = [
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "boto3>=1.28.0",
    "google-genai>=0.1.1; python_version >= '3.10'",
    "langchain>=0.1.0; python_version >= '3.9'",
    "langchain-core>=0.1.0; python_version >= '3.9'",
    "langchain-openai>=0.1.0; python_version >= '3.9'",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "live: marks tests as requiring live network access to the Sentra sandbox backend",
]

[tool.coverage.run]
source = ["src/sentra", "src/sentra_ai"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
